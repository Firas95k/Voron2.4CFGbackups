#####################################################################
# Timing and retract configuration – change values here only
#####################################################################

[idle_timeout]
# Generic heater safety.
# - Turns off ALL heaters after 'timeout' seconds of no G-code.
# - Does NOT disable steppers or modify homing / QGL validity.
# QGL validity and stepper disabling are managed only by
# [delayed_gcode expire_qgl_state] using qgl_window.
gcode:
    TURN_OFF_HEATERS              ; shut down hotend, bed, and any other heaters
timeout: 1200                       # keep equal to _TIMING_CONFIG.variable_idle_timeout_normal

[gcode_macro _TIMING_CONFIG]
# All time values are seconds. All retracts are mm.
#
# If you change variable_idle_timeout_normal, also edit [idle_timeout].timeout
# to the same value – Klipper can't template that field.
variable_idle_timeout_normal: 1200       # base idle timeout when not paused
variable_pause_window: 3600             # how long a PAUSE may last AND how long heaters may stay on while paused
variable_qgl_window: 3600               # QGL + homing validity window for fast-start
variable_qgl_status_interval: 900       # interval for QGL status reports

variable_retract_pause: 0.8             # retract distance in PAUSE / RESUME
variable_retract_end: 2.0               # retract distance in PRINT_END / CANCEL_PRINT

gcode:
    # No gcode; used only for variables.


#####################################################################
# QGL state and validity tracking
#####################################################################

[gcode_macro _QGL_STATE]
# Tracks whether a recent, controlled homing + gantry level exists and
# an approximate elapsed time since that event.
variable_valid: False       # set True only by QUAD_GANTRY_LEVEL macro
variable_elapsed: 0.0       # seconds since last valid QGL; updated by qgl_status
gcode:
    # No gcode body; this macro exists solely to hold the variables.


[delayed_gcode expire_qgl_state]
# Scheduled whenever QUAD_GANTRY_LEVEL or PRINT_END / CANCEL_PRINT runs.
# After qgl_window seconds, this:
#   - Invalidates QGL state.
#   - Disables steppers (M84), which also clears homed_axes.
#
# FIX: Guard against firing during an active print.
# Previously this fired unconditionally at qgl_window seconds. If a print
# ran longer than qgl_window (3600 s), M84 executed mid-print, disabling
# all steppers and losing position. Now it checks print state first:
#   - If printing: reschedule 600 s forward and do nothing else.
#   - If not printing: expire normally and disable steppers.
gcode:
    {% set timing     = printer["gcode_macro _TIMING_CONFIG"] %}
    {% set window     = timing.qgl_window|int %}
    {% set window_min = (window / 60.0)|round(1) %}
    {% set ps         = printer.print_stats.state %}

    {% if ps == "printing" %}
        # Print is active – do not expire QGL or disable steppers.
        # Reschedule 600 s forward so this check keeps running until
        # the print finishes, at which point the next check will expire normally.
        UPDATE_DELAYED_GCODE ID=expire_qgl_state DURATION=600
        RESPOND MSG="QGL expiry: print in progress – deferred 600s"
    {% else %}
        # Not printing – safe to expire QGL state and disable steppers.
        SET_GCODE_VARIABLE MACRO=_QGL_STATE VARIABLE=valid   VALUE=False  ; mark QGL as invalid
        SET_GCODE_VARIABLE MACRO=_QGL_STATE VARIABLE=elapsed VALUE={window} ; clamp elapsed to full window

        RESPOND MSG="QGL: validity window expired (~{window_min} min); disabling steppers"

        M84                               ; disable all steppers -> homing and QGL no longer trusted
    {% endif %}


[delayed_gcode qgl_status]
# Periodic QGL status reporting:
#   - Reschedules itself every qgl_status_interval seconds.
#   - Logs while not actively printing AND while printing (elapsed tracking only).
#   - Integrates an approximate "elapsed since last QGL" counter.
#   - While printing, elapsed is advanced silently (no console spam).
#   - While not printing, full status is reported to console.
#
# It is first armed by QUAD_GANTRY_LEVEL; it does not run until at
# least one QGL has been performed in this session.
gcode:
    {% set timing   = printer["gcode_macro _TIMING_CONFIG"] %}
    {% set qstate   = printer["gcode_macro _QGL_STATE"] %}
    {% set interval = timing.qgl_status_interval|int %}
    {% set window   = timing.qgl_window|int %}
    {% set ps       = printer.print_stats.state %}

    UPDATE_DELAYED_GCODE ID=qgl_status DURATION={interval}  ; re-arm this status check regardless of state

    {% if qstate.valid %}
        # Always advance elapsed, whether printing or not.
        # Previously elapsed was only updated outside of printing, causing
        # the counter to freeze mid-print and report stale remaining time
        # on any post-print status check.
        {% set new_elapsed = qstate.elapsed + interval %}
        {% if new_elapsed > window %}
            {% set new_elapsed = window %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_QGL_STATE VARIABLE=elapsed VALUE={new_elapsed}

        {% if ps == "printing" %}
            # Elapsed is advancing correctly but suppress console output
            # while printing to avoid log spam. No RESPOND here.
        {% else %}
            # Not printing – report full status to console.
            {% set remaining     = window - new_elapsed %}
            {% set remaining_min = (remaining / 60.0)|round(1) %}
            {% set window_min    = (window    / 60.0)|round(1) %}
            {% set elapsed_min   = (new_elapsed / 60.0)|round(1) %}

            RESPOND MSG="QGL status: VALID – elapsed={elapsed_min} min, remaining={remaining_min} min (window={window_min} min)"
        {% endif %}
    {% else %}
        {% if ps != "printing" %}
            RESPOND MSG="QGL status: NOT VALID – next PRINT_START will run full homing + QGL"
        {% endif %}
    {% endif %}


#####################################################################
# QUAD_GANTRY_LEVEL override (used by Mainsail QGL button)
#####################################################################

[gcode_macro QUAD_GANTRY_LEVEL]
description: Quad gantry level with homing check, Z re-home, QGL state tracking
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    {% set timing    = printer["gcode_macro _TIMING_CONFIG"] %}
    {% set window    = timing.qgl_window|int %}
    {% set interval  = timing.qgl_status_interval|int %}
    {% set window_min = (window / 60.0)|round(1) %}
    {% set homed     = printer.toolhead.homed_axes %}
    {% set have_xyz  = ('x' in homed and 'y' in homed and 'z' in homed) %}

    RESPOND MSG="QGL: macro started"

    {% if not have_xyz %}
        RESPOND MSG="QGL: axes not homed – running full G28"
        G28                            ; home all axes using your homing_override
    {% else %}
        RESPOND MSG="QGL: axes already homed – skipping initial G28"
    {% endif %}

    RESPOND MSG="QGL: running core quad gantry level"
    _QUAD_GANTRY_LEVEL                 ; original QUAD_GANTRY_LEVEL implementation
    RESPOND MSG="QGL: core quad gantry level finished"

    RESPOND MSG="QGL: re-homing Z after leveling"
    G28 Z                              ; re-home Z to establish accurate Z=0

    SET_GCODE_VARIABLE MACRO=_QGL_STATE VARIABLE=valid   VALUE=True   ; QGL is now trusted
    SET_GCODE_VARIABLE MACRO=_QGL_STATE VARIABLE=elapsed VALUE=0.0    ; reset elapsed timer

    RESPOND MSG="QGL: completed – validity window ~{window_min} min"

    UPDATE_DELAYED_GCODE ID=expire_qgl_state DURATION={window}   ; schedule QGL expiry
    UPDATE_DELAYED_GCODE ID=qgl_status      DURATION={interval}  ; start periodic status logging


[gcode_macro QGL]
description: Alias – run QUAD_GANTRY_LEVEL macro with full logic
gcode:
    QUAD_GANTRY_LEVEL                   ; simple alias for convenience


#####################################################################
# PRINT_START / PRINT_END
#####################################################################

[gcode_macro PRINT_END]
description: End print, park back-left, shut heaters, keep QGL/homing for QGL window
gcode:
    {% set timing    = printer["gcode_macro _TIMING_CONFIG"] %}
    {% set window    = timing.qgl_window|int %}
    {% set window_min = (window / 60.0)|round(1) %}
    {% set r_end     = timing.retract_end|float %}

    RESPOND MSG="PRINT_END: macro started – flushing moves and parking"

    M400                               ; wait for all queued moves to finish

    G91                                ; relative positioning for cleanup moves
    G1 E-{r_end} F1800                 ; retract filament by r_end mm at 30 mm/s
    G1 Z10 F3000                       ; lift Z by 10 mm
    G90                                ; return to absolute positioning

    G0 X0 Y350 F12000                  ; park at back-left (X=0, Y=350) at travel speed

    TURN_OFF_HEATERS                   ; turn off all heaters
    M107                               ; turn off part cooling fan

    UPDATE_DELAYED_GCODE ID=expire_qgl_state DURATION={window}  ; QGL remains valid for window seconds

    RESPOND MSG="PRINT_END: done – QGL stays valid for ~{window_min} min"


[gcode_macro PRINT_START]
description: Start print with full vs fast path depending on recent QGL+homing
gcode:
    {% set timing    = printer["gcode_macro _TIMING_CONFIG"] %}
    {% set qgl       = printer.quad_gantry_level %}
    {% set qgl_var   = printer["gcode_macro _QGL_STATE"] %}
    {% set homed     = printer.toolhead.homed_axes %}
    {% set have_xyz  = ('x' in homed and 'y' in homed and 'z' in homed) %}
    {% set BED        = params.BED_TEMP|default(110)|float %}
    {% set HOTEND     = params.EXTRUDER_TEMP|default(245)|float %}
    {% set PROBE_TEMP = 130 %}
    {% set idle_normal = timing.idle_timeout_normal|int %}

    RESPOND MSG="PRINT_START: macro started"

    # Fast-start condition:
    #   - axes homed (xyz)
    #   - QGL state marked valid
    #   - QGL transform applied in Klipper
    {% set fast_start = (have_xyz and qgl_var.valid and qgl.applied|default(False)) %}

    UPDATE_DELAYED_GCODE ID=expire_qgl_state DURATION=0   ; cancel any pending QGL-expiry timer

    M220 S100                            ; reset speed factor to 100 %
    M221 S100                            ; reset flow factor to 100 %
    G21                                  ; set units to millimeters
    G90                                  ; absolute positioning for XYZ
    M83                                  ; relative extrusion mode

    BED_MESH_CLEAR                       ; clear any previously loaded bed mesh

    # LEDs: heating (red)
    SET_LED LED=sb_leds RED=1 GREEN=0 BLUE=0 WHITE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=sb_leds RED=1 GREEN=0 BLUE=0 WHITE=0 INDEX=2 TRANSMIT=0
    SET_LED LED=sb_leds RED=1 GREEN=0 BLUE=0 WHITE=0 INDEX=3 TRANSMIT=1

    RESPOND MSG="PRINT_START: preheating – bed={BED}C, hotend={PROBE_TEMP}C (probe-safe)"

    # Extend idle_timeout before blocking heat waits.
    # Default is idle_timeout_normal (600 s). A cold bed can take >10 min to
    # reach temperature, which would trigger idle_timeout and kill all heaters
    # mid-wait. 3600 s gives a safe margin for any realistic heat-soak.
    SET_IDLE_TIMEOUT TIMEOUT=3600
    RESPOND MSG="PRINT_START: idle_timeout extended to 3600s for heat-soak"

    M140 S{BED}                          ; set bed target temperature (non-blocking)
    M104 S{PROBE_TEMP}                   ; set hotend target temp to probe-safe (non-blocking)
    M190 S{BED}                          ; wait for bed to reach BED – blocks until reached
    M109 S{PROBE_TEMP}                   ; wait for hotend to reach PROBE_TEMP – blocks until reached

    # Restore idle_timeout immediately after preheat is complete.
    # From this point onward, continuous G-code moves prevent idle_timeout
    # from triggering anyway, but restoring early keeps behavior predictable.
    SET_IDLE_TIMEOUT TIMEOUT={idle_normal}
    RESPOND MSG="PRINT_START: preheat complete – idle_timeout restored to {idle_normal}s"

    # LEDs: homing (blue)
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=1 WHITE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=1 WHITE=0 INDEX=2 TRANSMIT=0
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=1 WHITE=0 INDEX=3 TRANSMIT=1

    {% if not fast_start %}
        RESPOND MSG="PRINT_START: cold start – running full G28 + QGL"
        QUAD_GANTRY_LEVEL               ; homing + QGL macro – also re-arms expire_qgl_state
        G0 Z10 F3000                    ; move to safe Z height at 3000 mm/min
        RESPOND MSG="PRINT_START: full homing + QGL path finished"
    {% else %}
        RESPOND MSG="PRINT_START: fast start – reusing homing & QGL"
        G91                              ; relative Z lift
        G1 Z5 F3000                      ; lift Z by 5 mm
        G90                              ; back to absolute
    {% endif %}

    RESPOND MSG="PRINT_START: running adaptive bed mesh"

    # LEDs: mesh (green)
    SET_LED LED=sb_leds RED=0 GREEN=1 BLUE=0 WHITE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=sb_leds RED=0 GREEN=1 BLUE=0 WHITE=0 INDEX=2 TRANSMIT=0
    SET_LED LED=sb_leds RED=0 GREEN=1 BLUE=0 WHITE=0 INDEX=3 TRANSMIT=1

    BED_MESH_CALIBRATE ADAPTIVE=1       ; object-area mesh using EXCLUDE_OBJECT data

    RESPOND MSG="PRINT_START: adaptive bed mesh complete"

    RESPOND MSG="PRINT_START: heating hotend to {HOTEND}C for printing"

    # LEDs: final heating (red)
    SET_LED LED=sb_leds RED=1 GREEN=0 BLUE=0 WHITE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=sb_leds RED=1 GREEN=0 BLUE=0 WHITE=0 INDEX=2 TRANSMIT=0
    SET_LED LED=sb_leds RED=1 GREEN=0 BLUE=0 WHITE=0 INDEX=3 TRANSMIT=1

    M109 S{HOTEND}                      ; wait for hotend to reach final print temperature

    # LEDs: printing (white)
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=1 TRANSMIT=0
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=2 TRANSMIT=0
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=3 TRANSMIT=1

    # Kill the expire_qgl_state timer that QUAD_GANTRY_LEVEL armed during
    # cold-start. Without this, the timer fires at qgl_window seconds (3600 s)
    # and executes M84 mid-print, disabling steppers and losing position.
    # This line is safe on fast-start too – cancelling an already-dead timer
    # is a no-op in Klipper.
    UPDATE_DELAYED_GCODE ID=expire_qgl_state DURATION=0
    RESPOND MSG="PRINT_START: expire_qgl_state timer cancelled – steppers safe for full print duration"

    RESPOND MSG="PRINT_START: complete – handing over to slicer purge / first layer"


#####################################################################
# PAUSE / RESUME with unified pause window and retract parameter
#####################################################################

[delayed_gcode pause_timeout]
# If the printer remains in paused state for 'pause_window' seconds,
# CANCEL_PRINT is executed. Timed from the most recent PAUSE.
gcode:
    {% set ps = printer.pause_resume.is_paused %}
    {% if ps %}
        RESPOND MSG="PAUSE: timeout reached – cancelling print"
        CANCEL_PRINT                      ; run your CANCEL_PRINT macro
    {% endif %}


[gcode_macro _PAUSE_STATE]
# Holds the extruder target temperature across PAUSE/RESUME cycles so
# RESUME can reheat to the original print temperature.
variable_extruder_target: 0.0
gcode:
    # No gcode; used only for variables.


[gcode_macro PAUSE]
description: Pause: early cool-down, retract+Z-hop, park front-left
rename_existing: BASE_PAUSE
gcode:
    {% set timing    = printer["gcode_macro _TIMING_CONFIG"] %}
    {% set pause_win = timing.pause_window|int %}
    {% set pause_min = (pause_win / 60.0)|round(1) %}
    {% set r_pause   = timing.retract_pause|float %}

    RESPOND MSG="PAUSE: macro started"

    BASE_PAUSE                         ; invoke core PAUSE (pause_resume module)

    {% set current_target = printer.extruder.target|float %}
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=extruder_target VALUE={current_target} ; remember nozzle target

    M104 S180                          ; start cooling hotend toward 180C (non-blocking)
    RESPOND MSG="PAUSE: hotend cooling toward 180C"

    SET_IDLE_TIMEOUT TIMEOUT={pause_win}           ; allow heaters to stay on for pause_window seconds
    UPDATE_DELAYED_GCODE ID=pause_timeout DURATION={pause_win} ; arm auto-cancel timer

    M400                               ; wait until all moves in buffer are done

    G91                                ; relative positioning
    G1 E-{r_pause} F1800               ; retract filament by r_pause mm
    G1 Z10 F3000                       ; raise Z by 10 mm
    G90                                ; back to absolute

    G0 X0 Y0 F12000                    ; park at front-left corner

    RESPOND MSG="PAUSE: parked at X0 Y0 with Z raised; pause window ~{pause_min} min"


[gcode_macro RESUME]
description: Resume: restore idle_timeout and temp, then unretract and resume motion
rename_existing: BASE_RESUME
gcode:
    {% set timing      = printer["gcode_macro _TIMING_CONFIG"] %}
    {% set idle_normal = timing.idle_timeout_normal|int %}
    {% set idle_min    = (idle_normal / 60.0)|round(1) %}
    {% set r_pause     = timing.retract_pause|float %}

    RESPOND MSG="RESUME: macro started"

    UPDATE_DELAYED_GCODE ID=pause_timeout DURATION=0  ; cancel pending pause timeout
    SET_IDLE_TIMEOUT TIMEOUT={idle_normal}            ; restore base idle timeout
    RESPOND MSG="RESUME: idle_timeout restored to {idle_normal}s (~{idle_min} min)"

    {% set target = printer["gcode_macro _PAUSE_STATE"].extruder_target|float %}
    {% if target > 0 %}
        RESPOND MSG="RESUME: heating hotend back to {target}C"
        M109 S{target}                  ; wait for nozzle to return to stored target
    {% else %}
        RESPOND MSG="RESUME: no stored target temperature; skipping heat wait"
    {% endif %}

    G91                                 ; relative positioning
    G1 E{r_pause} F1800                 ; undo pause retract
    G90                                 ; absolute positioning

    BASE_RESUME                         ; invoke core RESUME logic (restore state + resume moves)

    RESPOND MSG="RESUME: motion state restored – print continuing"


#####################################################################
# CANCEL_PRINT
#####################################################################

[gcode_macro CANCEL_PRINT]
description: Cancel print, park back-left, hold nozzle at 130C for next start
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% set timing      = printer["gcode_macro _TIMING_CONFIG"] %}
    {% set idle_normal = timing.idle_timeout_normal|int %}
    {% set idle_min    = (idle_normal / 60.0)|round(1) %}
    {% set window      = timing.qgl_window|int %}
    {% set window_min  = (window / 60.0)|round(1) %}
    {% set r_end       = timing.retract_end|float %}

    RESPOND MSG="CANCEL_PRINT: macro started"

    UPDATE_DELAYED_GCODE ID=pause_timeout DURATION=0   ; cancel any pending pause timeout
    SET_IDLE_TIMEOUT TIMEOUT={idle_normal}             ; restore base idle timeout
    RESPOND MSG="CANCEL_PRINT: idle_timeout restored to {idle_normal}s (~{idle_min} min)"

    G91                                 ; relative positioning
    G1 E-{r_end} F1800                  ; retract filament by r_end mm
    G1 Z10 F3000                        ; raise nozzle by 10 mm
    G90                                 ; absolute positioning

    G0 X0 Y350 F12000                   ; park back-left at travel speed

    {% set PROBE_TEMP = 130 %}
    M104 S{PROBE_TEMP}                  ; set hotend to probe-safe 130C (non-blocking)
    RESPOND MSG="CANCEL_PRINT: hotend set to {PROBE_TEMP}C; bed left unchanged"

    UPDATE_DELAYED_GCODE ID=expire_qgl_state DURATION={window}   ; keep QGL valid for window seconds
    RESPOND MSG="CANCEL_PRINT: QGL remains valid for ~{window_min} min"

    CLEAR_PAUSE                          ; reset pause_resume internal state
    BASE_CANCEL_PRINT                    ; invoke core CANCEL_PRINT (notify host/virtual_sdcard)
    RESPOND MSG="CANCEL_PRINT: completed – job cancelled"
