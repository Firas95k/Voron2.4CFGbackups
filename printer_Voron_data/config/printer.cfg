# insert_gcode: FILAMENT_INSERTED   # Uncomment for auto-load on filament insert

# ─────────────────────────────────────────────────────────────────────────────
# BTT EDDY COIL PROBE  (Klipper built-in)
# Connected to EBB SB2240 via software I²C (bit-bang).
# Acts as both the Z probe and the Z homing endstop.
#
# Calibration sequence (must be done in order):
#   1. LDC_CALIBRATE_DRIVE_CURRENT CHIP=btt_eddy  → SAVE_CONFIG
#   2. Home XY, move to bed centre at ~20 mm Z
#   3. PROBE_EDDY_CURRENT_CALIBRATE CHIP=btt_eddy  → SAVE_CONFIG
#   4. TEMPERATURE_PROBE_CALIBRATE PROBE=btt_eddy TARGET=<max_coil_temp>
#      (installs scipy first: ~/klippy-env/bin/pip install scipy)
#
# Offsets: x=0 is correct for StealthBurner mount (nozzle and Eddy share X).
#          y=21.42 mm measured from nozzle tip to Eddy coil centre.
# ─────────────────────────────────────────────────────────────────────────────

[probe_eddy_ng eddy]
sensor_type: btt_eddy
i2c_mcu: EBBCan
i2c_bus: i2c1_PB8_PB9
i2c_address: 42
# i2c_software_scl_pin: EBBCan:PB8
# i2c_software_sda_pin: EBBCan:PB9
i2c_speed: 400000
x_offset: 0
y_offset: 25.4
# descend_z: distance (mm) to push below trigger point during tap probing.
# Start at 0.5 mm; decrease toward 0.0 if tap is too aggressive.
tap_threshold: 185
# tap_z_offset: Z offset applied after tap calibration.
# Leave at 0.0 initially; fine-tune with SET_GCODE_OFFSET Z=<adj> after prints.


# ─────────────────────────────────────────────────────────────────────────────
# EDDY THERMAL DRIFT COMPENSATION
# [temperature_probe] extends [temperature_sensor] with drift calibration.
# This section replaces a bare [temperature_sensor btt_eddy].
# The Eddy coil internal NTC thermistor is on EBBCan:PA3.
#
# After initial probe calibration, run thermal drift calibration:
#   TEMPERATURE_PROBE_CALIBRATE PROBE=btt_eddy TARGET=<max_coil_temp>
# Fill in the optional parameters below to automate the procedure.
# ─────────────────────────────────────────────────────────────────────────────

[temperature_sensor eddy]
sensor_type: Generic 3950
sensor_pin: EBBCan:PA3
min_temp: 0
max_temp: 90
# calibration_position: 175, 149.6, 0.5   # XY centre of 350 mm bed, Z clearance
# calibration_extruder_temp: 150       # Stable extruder temp before sampling
# extruder_heating_z: 50               # Z height held while extruder heats up
# calibration_bed_temp: 110            # Bed temp used during calibration sweep
# max_validation_temp: 105              # For enclosed printers, set 100–120


[adxl345]
cs_pin: EBBCan: PB12
spi_software_sclk_pin: EBBCan: PB10
spi_software_mosi_pin: EBBCan: PB11
spi_software_miso_pin: EBBCan: PB2
axes_map: z,-y,x

[neopixel sb_leds]
pin: EBBCan:PD3
chain_count: 1
color_order: GRBW
initial_RED: 1
initial_GREEN: 1
initial_BLUE: 1
initial_WHITE: 1

