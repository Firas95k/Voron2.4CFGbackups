#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################
[gcode_macro _HOME_X]
gcode:
    ## Set HOME_CURRENT to the current value that was in effect when you calculated stallguard sensitivity.  
    ## This should initially be what is set in your printer.cfg file for the x & y steppers.  
    ## Having this here will allow you to change motor current values in the printer.cfg file in the future while 
    ## eliminating the need to recalculate stall guard sensitivity.
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 1.35 %}  ## Change this to the vlaue you used when calibrating stallguard.  In your printer.cfg.
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    ## Uncomment the following to temporarily change acceleration if you are getting TMC Driver Undercurrent errors. 
    {% set RUN_ACCEL = printer.configfile.settings['printer'].max_accel|int %}	
    {% set HOME_ACCEL = 1000 %}
    SET_VELOCITY_LIMIT ACCEL={HOME_ACCEL}

    ## Home
     G28 X0
     # G28 X0
    ## Move away
    G91
    G1 X-10 F1200
    
    G4 P2000  # Wait 2 seconds… (give StallGuard registers time to clear).  You may need to give this more time if it's not reliable.

    ##  Set the current back to what's in the printer.cfg file. 
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

    ## Only uncomment if the code to modify acceleration above was uncommented.
    SET_VELOCITY_LIMIT ACCEL={RUN_ACCEL}

[gcode_macro _HOME_Y]
gcode:
    ## Set HOME_CURRENT to the current value that was in effect when you calculated stallguard sensitivity.  
    ## This should initially be what is set in your printer.cfg file for the x & y steppers.  
    ## Having this here will allow you to change motor current values in the printer.cfg file in the future while 
    ## eliminating the need to recalculate stall guard sensitivity.
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 1.35 %}   ## Change this to the vlaue you used when calibrating stallguard.  In your printer.cfg.
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    ## Uncomment the following to temporarily change acceleration if you are getting TMC Driver Undercurrent errors.
    {% set RUN_ACCEL = printer.configfile.settings['printer'].max_accel|int %}	
    {% set HOME_ACCEL = 1000 %}
    SET_VELOCITY_LIMIT ACCEL={HOME_ACCEL}

    # Home
     G28 Y0
     # G28 Y0

    # Move away so the x-axis is no longer touching the back of the gantry
    G91
    G1 Y-10 F1200

    G4 P2000  # Wait 2 seconds… (give StallGuard registers time to clear).  You may need to give this more time if it's not reliable.

    ##  Set the current back to what's in the printer.cfg file. 
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

    ## Only uncomment if the code to modify acceleration above was uncommented.
    SET_VELOCITY_LIMIT ACCEL={RUN_ACCEL}

[gcode_macro _EDDY_VARS]
variable_z_offset: 0.0          # persists via SAVE_VARIABLE
gcode:

[gcode_macro _RELOAD_Z_OFFSET_FROM_PROBE]
gcode:
    {% set Z = printer.toolhead.position.z %}
    SET_KINEMATIC_POSITION Z={Z - printer.probe.last_probe_position.z}

[gcode_macro _SET_Z_FROM_PROBE]
description: Probe Z and apply offset correction. METHOD=tap for homing.
gcode:
    {% set METHOD = params.METHOD | default("tap") %}
    PROBE METHOD={METHOD}
    _RELOAD_Z_OFFSET_FROM_PROBE
    {% set saved_offset = printer.save_variables.variables.z_offset | default(0.0) %}
    SET_GCODE_OFFSET Z={saved_offset} MOVE=1
    G0 Z5 F1200

[force_move]
enable_force_move: True

[homing_override]
gcode:
  # SET_KINEMATIC_POSITION Z=0
  # G0 Z10 F1200
  # SET_KINEMATIC_POSITION CLEAR_HOMED=Z
  
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  {% if home_all or 'X' in params %}
    _HOME_X
  {% endif %}
  
  {% if home_all or 'Y' in params %}
    _HOME_Y
  {% endif %}
  
  {% if home_all or 'Z' in params %}
    G90
    G1 X175 Y149.6 F12000  ## Change this.  Should home to the z endstop pin if you don't use TAP.  Also, this is for a Voron 2.4 350.    
    _SET_Z_FROM_PROBE METHOD=tap   ## Home Z
    G1 Z10 F1200
  {% endif %}

[gcode_macro SET_Z_OFFSET_EDDY]
description: Save a persistent z-offset like a standard probe, How beta z-offset works: After every G28, SET_Z_FROM_PROBE homes via tap, corrects the kinematic error, then re-applies the saved offset from eddy_vars.cfg. This is what lets you use the Mainsail/Fluidd babystep "Save" button persistently.
gcode:
    {% set OFFSET = params.OFFSET | default(0.0) | float %}
    SAVE_VARIABLE VARIABLE=z_offset VALUE={OFFSET}
    SET_GCODE_OFFSET Z={OFFSET} MOVE=1
    M117 Z-offset saved: {OFFSET}

[quad_gantry_level]
gantry_corners:
  -60,-10
  410,420
points:
  50,25
  50,275
  300,275
  300,25
speed: 400
horizontal_move_z: 5
min_horizontal_move_z: 1.0
adaptive_horizontal_move_z: true
retries: 5
retry_tolerance: 0.05
max_adjust: 4

[bed_mesh]
speed: 200
horizontal_move_z: 1
# scan_overshoot: 8.0
mesh_min: 40, 40
mesh_max: 310,310
probe_count: 9, 9
fade_start: 0.6
fade_end: 10.0
algorithm: bicubic
adaptive_margin: 5
#relative_reference_index: 14

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_ORIG #BED_MESH_CALIBRATE Override, This sets rapid_scan as the default method for all mesh calls and enables adaptive meshing:
gcode:
    {% set METHOD = params.METHOD | default("rapid_scan") %}
    {% set ADAPTIVE = params.ADAPTIVE | default(0) %}
    _BED_MESH_CALIBRATE_ORIG METHOD={METHOD} ADAPTIVE={ADAPTIVE} {rawparams}
